<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 381" role="img" aria-label="RAG：每个阶段都需要独立评估">
<defs><marker id="retrieval-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif" fill="#18334a">
<text x="34" y="40" font-size="23" font-weight="700">RAG：每个阶段都需要独立评估</text>
<text x="34" y="70" font-size="15" fill="#52687c">检索召回率不等于答案正确率；引文存在不等于引文支持答案</text>
<rect x="30" y="98" width="232" height="83" rx="10" fill="#e6f1fb" stroke="#bacbda"/>
<text x="44" y="126" font-size="16" font-weight="600">问题与权限</text>
<text x="44" y="149" font-size="14" font-weight="400">锁定可见文档版本</text>
<path d="M266,140 H296" stroke="#64748b" stroke-width="2" marker-end="url(#retrieval-pipeline-arrow)"/>
<rect x="300" y="98" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="314" y="126" font-size="16" font-weight="600">候选检索</text>
<text x="314" y="149" font-size="14" font-weight="400">稀疏 / 稠密 / 混合</text>
<path d="M536,140 H566" stroke="#64748b" stroke-width="2" marker-end="url(#retrieval-pipeline-arrow)"/>
<rect x="570" y="98" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="584" y="126" font-size="16" font-weight="600">重排序与证据整理</text>
<text x="584" y="149" font-size="14" font-weight="400">去重、位置、长度、引文</text>
<path d="M806,140 H836" stroke="#64748b" stroke-width="2" marker-end="url(#retrieval-pipeline-arrow)"/>
<rect x="840" y="98" width="232" height="83" rx="10" fill="#f3e8fb" stroke="#bacbda"/>
<text x="854" y="126" font-size="16" font-weight="600">回答与核验</text>
<text x="854" y="149" font-size="14" font-weight="400">正确性、支撑率、拒答</text>
<rect x="30" y="231" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="44" y="259" font-size="16" font-weight="600">闭卷对照</text>
<text x="44" y="282" font-size="14" font-weight="400">测参数记忆基线</text>
<path d="M266,273 H296" stroke="#64748b" stroke-width="2" marker-end="url(#retrieval-pipeline-arrow)"/>
<rect x="300" y="231" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="314" y="259" font-size="16" font-weight="600">人工充分证据</text>
<text x="314" y="282" font-size="14" font-weight="400">隔离检索器失败</text>
<path d="M536,273 H566" stroke="#64748b" stroke-width="2" marker-end="url(#retrieval-pipeline-arrow)"/>
<rect x="570" y="231" width="232" height="83" rx="10" fill="#f3e8fb" stroke="#bacbda"/>
<text x="584" y="259" font-size="16" font-weight="600">错误 / 缺失证据</text>
<text x="584" y="282" font-size="14" font-weight="400">测冲突与不确定性</text>
<path d="M806,273 H836" stroke="#64748b" stroke-width="2" marker-end="url(#retrieval-pipeline-arrow)"/>
<rect x="840" y="231" width="232" height="83" rx="10" fill="#e6f1fb" stroke="#bacbda"/>
<text x="854" y="259" font-size="16" font-weight="600">按版本回归</text>
<text x="854" y="282" font-size="14" font-weight="400">索引、模型、提示共同固定</text>
</g></svg>