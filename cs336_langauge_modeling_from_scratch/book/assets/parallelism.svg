<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 381" role="img" aria-label="不同并行策略切分不同对象">
<defs><marker id="parallelism-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif" fill="#18334a">
<text x="34" y="40" font-size="23" font-weight="700">不同并行策略切分不同对象</text>
<text x="34" y="70" font-size="15" fill="#52687c">它们改变的通信路径不同；性能取决于组网与调度</text>
<rect x="30" y="98" width="232" height="83" rx="10" fill="#e6f1fb" stroke="#bacbda"/>
<text x="44" y="126" font-size="16" font-weight="600">数据并行 DP</text>
<text x="44" y="149" font-size="14" font-weight="400">样本分片，复制参数</text>
<rect x="300" y="98" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="314" y="126" font-size="16" font-weight="600">FSDP / ZeRO</text>
<text x="314" y="149" font-size="14" font-weight="400">分片状态，按需聚集</text>
<rect x="570" y="98" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="584" y="126" font-size="16" font-weight="600">张量并行 TP</text>
<text x="584" y="149" font-size="14" font-weight="400">切分层内矩阵</text>
<rect x="840" y="98" width="232" height="83" rx="10" fill="#f3e8fb" stroke="#bacbda"/>
<text x="854" y="126" font-size="16" font-weight="600">流水线 PP</text>
<text x="854" y="149" font-size="14" font-weight="400">切分层，调度 microbatch</text>
<rect x="30" y="231" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="44" y="259" font-size="16" font-weight="600">序列并行 SP</text>
<text x="44" y="282" font-size="14" font-weight="400">分片独立逐位置算子</text>
<rect x="300" y="231" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="314" y="259" font-size="16" font-weight="600">上下文并行 CP</text>
<text x="314" y="282" font-size="14" font-weight="400">长序列与 KV 跨卡</text>
<rect x="570" y="231" width="232" height="83" rx="10" fill="#f3e8fb" stroke="#bacbda"/>
<text x="584" y="259" font-size="16" font-weight="600">专家并行 EP</text>
<text x="584" y="282" font-size="14" font-weight="400">路由到专家，再合并</text>
<rect x="840" y="231" width="232" height="83" rx="10" fill="#e6f1fb" stroke="#bacbda"/>
<text x="854" y="259" font-size="16" font-weight="600">共同约束</text>
<text x="854" y="282" font-size="14" font-weight="400">拓扑、带宽、激活峰值</text>
</g></svg>