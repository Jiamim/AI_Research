<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 381" role="img" aria-label="MLA 内容分支：两种等价的计算路径">
<defs><marker id="mla-absorption-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif" fill="#18334a">
<text x="34" y="40" font-size="23" font-weight="700">MLA 内容分支：两种等价的计算路径</text>
<text x="34" y="70" font-size="15" fill="#52687c">恒等式假定线性投影；RoPE 位置分支与非线性归一化需要单独处理</text>
<rect x="30" y="98" width="232" height="83" rx="10" fill="#e6f1fb" stroke="#bacbda"/>
<text x="44" y="126" font-size="16" font-weight="600">展开 K / V</text>
<text x="44" y="149" font-size="14" font-weight="400">由每个历史 latent 投影</text>
<path d="M266,140 H296" stroke="#64748b" stroke-width="2" marker-end="url(#mla-absorption-arrow)"/>
<rect x="300" y="98" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="314" y="126" font-size="16" font-weight="600">逐头计算分数</text>
<text x="314" y="149" font-size="14" font-weight="400">q 与展开的 K 点积</text>
<path d="M536,140 H566" stroke="#64748b" stroke-width="2" marker-end="url(#mla-absorption-arrow)"/>
<rect x="570" y="98" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="584" y="126" font-size="16" font-weight="600">聚合 V 再投影</text>
<text x="584" y="149" font-size="14" font-weight="400">各头输出相加</text>
<rect x="30" y="231" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="44" y="259" font-size="16" font-weight="600">吸收投影</text>
<text x="44" y="282" font-size="14" font-weight="400">query 转到 latent 空间</text>
<path d="M266,273 H296" stroke="#64748b" stroke-width="2" marker-end="url(#mla-absorption-arrow)"/>
<rect x="300" y="231" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="314" y="259" font-size="16" font-weight="600">逐头聚合 latent</text>
<text x="314" y="282" font-size="14" font-weight="400">保留各自 softmax 分布</text>
<path d="M536,273 H566" stroke="#64748b" stroke-width="2" marker-end="url(#mla-absorption-arrow)"/>
<rect x="570" y="231" width="232" height="83" rx="10" fill="#f3e8fb" stroke="#bacbda"/>
<text x="584" y="259" font-size="16" font-weight="600">合并 V / O 投影</text>
<text x="584" y="282" font-size="14" font-weight="400">得到相同的内容输出</text>
</g></svg>