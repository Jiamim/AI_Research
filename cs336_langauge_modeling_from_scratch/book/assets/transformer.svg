<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 465" role="img" aria-label="pre-norm Transformer：明确画出两次残差相加">
<title>pre-norm Transformer：明确画出两次残差相加</title><desc>绿色旁路传递原状态；归一化在子层支路上，MLP 读取注意力更新后的 U</desc>
<defs><marker id="transformer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif" fill="#18334a">
<text x="34" y="40" font-size="23" text-anchor="start" fill="#18334a">pre-norm Transformer：明确画出两次残差相加</text>
<text x="34" y="70" font-size="15" text-anchor="start" fill="#18334a">绿色旁路传递原状态；归一化在子层支路上，MLP 读取注意力更新后的 U</text>
<rect x="30" y="150" width="100" height="66" rx="10" fill="#e6f1fb" stroke="#bacbda"/><text x="80.0" y="177" font-size="16" text-anchor="middle" fill="#18334a">X</text><text x="80.0" y="199" font-size="14" text-anchor="middle" fill="#18334a">[B,T,d]</text>
<rect x="190" y="150" width="150" height="66" rx="10" fill="#e3f4ec" stroke="#bacbda"/><text x="265.0" y="177" font-size="16" text-anchor="middle" fill="#18334a">RMSNorm</text><text x="265.0" y="199" font-size="14" text-anchor="middle" fill="#18334a">仅作用于支路</text>
<rect x="390" y="150" width="290" height="66" rx="10" fill="#fff1d6" stroke="#bacbda"/><text x="535.0" y="177" font-size="16" text-anchor="middle" fill="#18334a">因果注意力 + 输出投影</text><text x="535.0" y="199" font-size="14" text-anchor="middle" fill="#18334a">Q/K 施加 RoPE；逐头归一化</text>
<rect x="890" y="150" width="155" height="66" rx="10" fill="#f3e8fb" stroke="#bacbda"/><text x="967.5" y="177" font-size="16" text-anchor="middle" fill="#18334a">U</text><text x="967.5" y="199" font-size="14" text-anchor="middle" fill="#18334a">[B,T,d]</text>
<path d="M130,183 H186" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<path d="M340,183 H386" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<path d="M680,183 H741" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<path d="M795,183 H886" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<circle cx="770" cy="183" r="25" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="770" y="191" font-size="26" text-anchor="middle" fill="#18334a">+</text>
<path d="M80,150 V114 H770 V156" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#transformer-arrow)"/>
<text x="440" y="101" font-size="15" text-anchor="middle" fill="#087e8b">X 的恒等旁路</text>
<rect x="30" y="332" width="100" height="66" rx="10" fill="#e6f1fb" stroke="#bacbda"/><text x="80.0" y="359" font-size="16" text-anchor="middle" fill="#18334a">U</text><text x="80.0" y="381" font-size="14" text-anchor="middle" fill="#18334a">[B,T,d]</text>
<rect x="190" y="332" width="150" height="66" rx="10" fill="#e3f4ec" stroke="#bacbda"/><text x="265.0" y="359" font-size="16" text-anchor="middle" fill="#18334a">RMSNorm</text><text x="265.0" y="381" font-size="14" text-anchor="middle" fill="#18334a">仅作用于支路</text>
<rect x="390" y="332" width="290" height="66" rx="10" fill="#fff1d6" stroke="#bacbda"/><text x="535.0" y="359" font-size="16" text-anchor="middle" fill="#18334a">SwiGLU</text><text x="535.0" y="381" font-size="14" text-anchor="middle" fill="#18334a">SiLU(gate) × up → down</text>
<rect x="890" y="332" width="155" height="66" rx="10" fill="#f3e8fb" stroke="#bacbda"/><text x="967.5" y="359" font-size="16" text-anchor="middle" fill="#18334a">Y</text><text x="967.5" y="381" font-size="14" text-anchor="middle" fill="#18334a">[B,T,d]</text>
<path d="M130,365 H186" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<path d="M340,365 H386" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<path d="M680,365 H741" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<path d="M795,365 H886" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<circle cx="770" cy="365" r="25" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="770" y="373" font-size="26" text-anchor="middle" fill="#18334a">+</text>
<path d="M80,332 V296 H770 V338" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#transformer-arrow)"/>
<text x="440" y="283" font-size="15" text-anchor="middle" fill="#087e8b">U 的恒等旁路</text>
<path d="M967,216 V254 H18 V365 H27" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#transformer-arrow)"/>
<text x="540" y="437" font-size="16" text-anchor="middle" fill="#18334a">先 U = X + Attention(Norm(X))，再 Y = U + MLP(Norm(U))</text>
</g></svg>