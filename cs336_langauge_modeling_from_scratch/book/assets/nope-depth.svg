<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 381" role="img" aria-label="NoPE 的顺序不变性：需要说明网络深度">
<defs><marker id="nope-depth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif" fill="#18334a">
<text x="34" y="40" font-size="23" font-weight="700">NoPE 的顺序不变性：需要说明网络深度</text>
<text x="34" y="70" font-size="15" fill="#52687c">随机初始化小模型的实测反例；因果 mask、训练后利用和长度泛化需分别验证</text>
<rect x="30" y="98" width="232" height="83" rx="10" fill="#e6f1fb" stroke="#bacbda"/>
<text x="44" y="126" font-size="16" font-weight="600">前缀交换</text>
<text x="44" y="149" font-size="14" font-weight="400">[3,5,9] → [5,3,9]</text>
<path d="M266,140 H296" stroke="#64748b" stroke-width="2" marker-end="url(#nope-depth-arrow)"/>
<rect x="300" y="98" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="314" y="126" font-size="16" font-weight="600">单层最后 query</text>
<text x="314" y="149" font-size="14" font-weight="400">读取相同 K/V 集合</text>
<path d="M536,140 H566" stroke="#64748b" stroke-width="2" marker-end="url(#nope-depth-arrow)"/>
<rect x="570" y="98" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="584" y="126" font-size="16" font-weight="600">最后 logits 不变</text>
<text x="584" y="149" font-size="14" font-weight="400">差值 0：单层对照</text>
<rect x="30" y="231" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="44" y="259" font-size="16" font-weight="600">首层较早位置</text>
<text x="44" y="282" font-size="14" font-weight="400">已读取不同前缀</text>
<path d="M266,273 H296" stroke="#64748b" stroke-width="2" marker-end="url(#nope-depth-arrow)"/>
<rect x="300" y="231" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="314" y="259" font-size="16" font-weight="600">第二层 K/V</text>
<text x="314" y="282" font-size="14" font-weight="400">隐藏表示集合改变</text>
<path d="M536,273 H566" stroke="#64748b" stroke-width="2" marker-end="url(#nope-depth-arrow)"/>
<rect x="570" y="231" width="232" height="83" rx="10" fill="#f3e8fb" stroke="#bacbda"/>
<text x="584" y="259" font-size="16" font-weight="600">双层能够区分顺序</text>
<text x="584" y="282" font-size="14" font-weight="400">最大差值 0.187</text>
</g></svg>