<text x="34" y="70" font-size="15" text-anchor="start" fill="#18334a">例：BOS_A、a、EOS_A、BOS_B、b、EOS_B、PAD；按独立文档似然训练</text>
<text x="34" y="108" font-size="14" text-anchor="start" fill="#18334a">A0/B0 是 BOS；A2/B2 是 EOS；PAD 不属于任何文档</text>
