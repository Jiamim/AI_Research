<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 381" role="img" aria-label="大词表交叉熵：前向归约与反向重算">
<defs><marker id="vocabulary-loss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,Microsoft YaHei,sans-serif" fill="#18334a">
<text x="34" y="40" font-size="23" font-weight="700">大词表交叉熵：前向归约与反向重算</text>
<text x="34" y="70" font-size="15" fill="#52687c">数学等价不代表 GPU 性能等价；普通 autograd 循环可能仍保留每块中间量</text>
<rect x="30" y="98" width="232" height="83" rx="10" fill="#e6f1fb" stroke="#bacbda"/>
<text x="44" y="126" font-size="16" font-weight="600">隐藏状态与权重</text>
<text x="44" y="149" font-size="14" font-weight="400">H [M,d]；W [V,d]</text>
<path d="M266,140 H296" stroke="#64748b" stroke-width="2" marker-end="url(#vocabulary-loss-arrow)"/>
<rect x="300" y="98" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="314" y="126" font-size="16" font-weight="600">词表块 [M,b]</text>
<text x="314" y="149" font-size="14" font-weight="400">每块计算 logits 与 LSE</text>
<path d="M536,140 H566" stroke="#64748b" stroke-width="2" marker-end="url(#vocabulary-loss-arrow)"/>
<rect x="570" y="98" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="584" y="126" font-size="16" font-weight="600">全局行统计</text>
<text x="584" y="149" font-size="14" font-weight="400">合并 LSE，减目标 logit</text>
<path d="M806,140 H836" stroke="#64748b" stroke-width="2" marker-end="url(#vocabulary-loss-arrow)"/>
<rect x="840" y="98" width="232" height="83" rx="10" fill="#f3e8fb" stroke="#bacbda"/>
<text x="854" y="126" font-size="16" font-weight="600">平均 loss</text>
<text x="854" y="149" font-size="14" font-weight="400">保存 H/W/标签/行统计</text>
<rect x="30" y="231" width="232" height="83" rx="10" fill="#e3f4ec" stroke="#bacbda"/>
<text x="44" y="259" font-size="16" font-weight="600">反向收到 dLoss</text>
<text x="44" y="282" font-size="14" font-weight="400">使用相同输入与权重</text>
<path d="M266,273 H296" stroke="#64748b" stroke-width="2" marker-end="url(#vocabulary-loss-arrow)"/>
<rect x="300" y="231" width="232" height="83" rx="10" fill="#fff1d6" stroke="#bacbda"/>
<text x="314" y="259" font-size="16" font-weight="600">重算块概率</text>
<text x="314" y="282" font-size="14" font-weight="400">exp(logits − LSE)</text>
<path d="M536,273 H566" stroke="#64748b" stroke-width="2" marker-end="url(#vocabulary-loss-arrow)"/>
<rect x="570" y="231" width="232" height="83" rx="10" fill="#f3e8fb" stroke="#bacbda"/>
<text x="584" y="259" font-size="16" font-weight="600">减目标 one-hot</text>
<text x="584" y="282" font-size="14" font-weight="400">除有效 token 总数</text>
<path d="M806,273 H836" stroke="#64748b" stroke-width="2" marker-end="url(#vocabulary-loss-arrow)"/>
<rect x="840" y="231" width="232" height="83" rx="10" fill="#e6f1fb" stroke="#bacbda"/>
<text x="854" y="259" font-size="16" font-weight="600">累加 dH / 写 dW</text>
<text x="854" y="282" font-size="14" font-weight="400">不保存完整 [M,V] logits</text>
</g></svg>