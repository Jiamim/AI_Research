<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">ZeroQuant：细粒度量化与逐层蒸馏</title>
<desc id="desc">结合分组权重量化、per-token 激活量化、逐层蒸馏和融合内核。局部蒸馏只保存当前层的训练状态，以教师层输出指导低比特学生层适配。；教师层生成目标 XWᵀ；激活逐 token、权重分组量化；STE 更新当前层主权重；导出后需融合量化与计算</desc>
