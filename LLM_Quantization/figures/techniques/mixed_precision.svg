<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">层级与组级混合精度：在预算内分配 bit</title>
<desc id="desc">在总存储预算下，为不同层或同一层的不同权重组选择位宽。比较候选格式的失真和完整存储成本，把更多预算用于敏感位置；最终还要验证完整层输出及内核支持。；分配单位：层或组；测量候选位宽的误差；统计权重和元数据成本；预算内选择
验证完整输出</desc>
