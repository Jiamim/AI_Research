<title id="title">QuIP#：Hadamard 与 E8 格点子问题</title>
<desc id="desc">QuIP# 将随机 Hadamard 非相干化、块级 LDLQ 和有限 E8P 向量码本结合。八维联合编码能利用空间几何；理解有限码本之前，可先学习 E8 格的最近点规则。；随机 Hadamard 分散坐标；八维向量交给码本；比较偶数和整数点与半整数点；完整方法用有限 E8P 与块反馈</desc>
