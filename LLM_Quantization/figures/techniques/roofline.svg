<text x="148.0" y="154" font-size="17" text-anchor="middle" fill="#173650">估计计算量与搬运字节</text>
<rect x="294" y="100" width="248" height="124" rx="12" fill="white" stroke="#c7d6e5" stroke-width="1.5"/>
<text x="312" y="127" font-size="14" font-weight="700" fill="#31748f">02</text>
<text x="418.0" y="154" font-size="17" text-anchor="middle" fill="#173650">取计算/带宽瓶颈较大者</text>
