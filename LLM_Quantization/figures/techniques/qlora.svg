<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
<title id="title">QLoRA：冻结 NF4 基础模型，训练 LoRA</title>
<desc id="desc">基础权重压缩保存、计算时反量化，训练只更新高精度低秩适配器。梯度仍可通过基础计算路径传递到适配器，但基础权重和编码保持冻结。；输入 X；基础 NF4 编码冻结；基础路径：反量化 W 后相乘；适配路径：(XAᵀ)Bᵀ；输出求和，仅更新 A/B</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#31748f"/></marker></defs>
