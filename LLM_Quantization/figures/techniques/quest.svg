<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">QuEST：高斯拟合与信任梯度</title>
<desc id="desc">前向在 Hadamard 域进行 RMS 归一化与高斯 MSE 拟合，反向仅信任量化误差处于阈值内的分量，再把梯度变回原坐标。；Hadamard 与 RMS 归一化；高斯 MSE 决定量化范围；量化误差形成 trust mask；掩码梯度逆变换回主权重</desc>
