<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">ParetoQ：位宽、网格与训练预算一起比较</title>
<desc id="desc">公平比较极低位宽时，必须共同控制量化器、模型规模和训练预算。不同位宽适合的网格不同，尤其要区分对称四级网格与包含零的整数网格。；固定比较的模型与训练预算；按位宽选择量化网格；学习尺度并进行 QAT；比较质量、存储和实际速度</desc>
