<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
<title id="title">LLM.int8()：离群通道分流</title>
<desc id="desc">将包含激活离群值的输入特征列拆到高精度支路，其余列进行向量级 INT8 量化。两条支路的矩阵乘相加，避免少量极端通道控制所有普通值的步长。；检测激活超过阈值的列；普通列：INT8 QDQ 后矩阵乘；离群列：高精度矩阵乘；两支路求和得到输出</desc>
